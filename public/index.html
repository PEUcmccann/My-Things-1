<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover lets the app draw under the notch; SafeAreaView adds the insets. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover"
    />
    <title>%WEB_TITLE%</title>
    <!--
      Opened from the iPhone Home Screen, the web app runs full screen like an app.
      Links are relative (no leading /) so they work at the site root and under the
      GitHub Pages subpath (/My-Things-1/). Expo has no base-URL placeholder for this file.
    -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MyThings" />
    <!--
      black-translucent lets the app paint behind the status bar (SafeAreaView keeps content
      below it), so the bar takes the app's background. Its text is always white, so light mode
      switches back to default (dark text on a light bar) before iOS reads the tag.
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      if (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) {
        document
          .querySelector('meta[name="apple-mobile-web-app-status-bar-style"]')
          .setAttribute("content", "default");
      }
    </script>
    <!-- The app's own backgrounds (src/app/theme.tsx), so the status bar blends in. -->
    <meta name="theme-color" content="#F7F8F8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121416" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.json" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /*
        The app's background (src/app/theme.tsx) wherever the app doesn't paint: behind the
        status bar, behind the keyboard and when the page is pulled past its edges.
      */
      :root {
        color-scheme: light dark;
      }
      html,
      body {
        background-color: #f7f8f8;
        overscroll-behavior: none;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background-color: #121416;
        }
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
